name: Build
on: [push, pull_request, workflow_dispatch]
defaults:
  run:
    shell: bash

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache

jobs:
  build_linux:
    name: ${{ matrix.platform }} (${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        arch: [x86_64, x86_32]
        platform: [linux, windows, android]
        include:
          - platform: linux
            arch: x86_32
            packages: [g++-multilib]
          - platform: windows
            packages: [g++-mingw-w64]
          - platform: android
            arch: arm64
            target: template_debug
          - platform: android
            arch: arm64
            target: template_release
          - platform: android
            arch: arm32
            target: template_debug
          - platform: android
            arch: arm32
            target: template_release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libltdl-dev ${{ join(matrix.packages, ' ') }}
      - name: Setup godot-cpp
        uses: ./lib/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.platform }}
          windows-compiler: msvc
      - name: Cache SCons files
        uses: actions/cache@v6
        with:
          path: .scons-cache/
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ hashfiles('.gitmodules', 'src/*.cpp', 'src/*.hpp') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-
      - name: Build artifact
        run: |
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ matrix.target }} ${{ join(matrix.scons-args, ' ') }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            addons/cffi/build/libcffi.*

  build_macos:
    name: ${{ matrix.platform }} (${{ matrix.arch }}, ${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        arch: [universal]
        platform: [macos, ios]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install dependencies
        run: |
          brew install autoconf automake libtool texinfo
      - name: Setup godot-cpp
        uses: ./lib/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.platform }}
      - name: Cache SCons files
        uses: actions/cache@v6
        with:
          path: .scons-cache/
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ hashfiles('.gitmodules', 'src/*.cpp', 'src/*.hpp') }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-
      - name: Build artifact
        run: |
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ matrix.target }}
        env:
          PYTHON_BIN: python3
      - name: Sign the Apple artifacts
        run: |
          # arm64 will not load unsigned code, and the signature the linker leaves
          # on a freshly linked dylib does not survive being zipped and unzipped by
          # a user. Ad-hoc is enough, since there is no Developer ID here.
          for f in addons/cffi/build/libcffi.*.dylib; do
            [ -e "$f" ] || continue
            codesign --force --sign - "$f"
            codesign --verify "$f"
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            addons/cffi/build/libcffi.*

  distribute_zip:
    name: Distribute zip
    needs: [build_linux, build_macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        id: download
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Copy artifacts to build folder
        run: cp -r ${{ steps.download.outputs.download-path }}/**/libcffi* addons/cffi/build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cffi-gdextension
          path: |
            UNLICENSE
            addons/cffi/**

  release:
    name: Publish release
    needs: [distribute_zip]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh infers the repository from a git working tree, so the job needs one:
      # without this it fails with "fatal: not a git repository".
      - uses: actions/checkout@v7
      - name: Download the combined addon
        uses: actions/download-artifact@v8
        with:
          name: cffi-gdextension
          path: cffi-gdextension
      - name: Package it
        run: |
          (cd cffi-gdextension && zip -qr "../cffi-gdextension-${GITHUB_REF_NAME}.zip" .)
          ls -l "cffi-gdextension-${GITHUB_REF_NAME}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "cffi-gdextension-${GITHUB_REF_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "cffi-gdextension ${GITHUB_REF_NAME}" \
            --generate-notes
